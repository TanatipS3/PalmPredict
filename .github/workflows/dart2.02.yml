name: Flutter Android APK
on:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-android.yml'
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # match your local
          
      - name: Pub get
        run: flutter pub get
        
      # Decode keystore IF secret is present (no YAML "if:" — we check in shell)
      - name: Prepare signing (conditional in shell)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔐 Keystore secret found — configuring release signing"
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            
            # Debug: Check if environment variables are set
            echo "🔍 Debug: Checking environment variables..."
            echo "ANDROID_KEY_ALIAS is set: $([ -n "$ANDROID_KEY_ALIAS" ] && echo 'YES' || echo 'NO')"
            echo "ANDROID_KEYSTORE_PASSWORD is set: $([ -n "$ANDROID_KEYSTORE_PASSWORD" ] && echo 'YES' || echo 'NO')"
            echo "ANDROID_KEY_PASSWORD is set: $([ -n "$ANDROID_KEY_PASSWORD" ] && echo 'YES' || echo 'NO')"
            
            # Create key.properties file with actual values
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}" > android/key.properties
            echo "keyPassword=${ANDROID_KEY_PASSWORD}" >> android/key.properties
            echo "keyAlias=${ANDROID_KEY_ALIAS}" >> android/key.properties
            echo "storeFile=./app/keystore.jks" >> android/key.properties
            
            echo "✅ Created key.properties file"
            echo "📋 Contents of key.properties (passwords hidden):"
            sed 's/Password=.*/Password=***HIDDEN***/g' android/key.properties
            
            # Verify keystore file exists and check its info
            echo "🔍 Keystore file check:"
            ls -la android/app/keystore.jks
            
            # Test keystore integrity (this will fail if password is wrong, but that's expected for debugging)
            echo "🔍 Testing keystore access (this may show an error, that's normal for debugging):"
            keytool -list -keystore android/app/keystore.jks -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" -v || echo "Keystore test failed - check your secrets"
          else
            echo "ℹ️ No keystore provided. Will build an UNSIGNED release."
          fi
          
      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

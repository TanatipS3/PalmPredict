# This workflow is named "Flutter Android APK" and will be displayed in the GitHub Actions UI.
name: Flutter Android APK

# This section defines when the workflow will run.
on:
  # The workflow runs on every push to the 'main' branch, but only if changes are made
  # to the specified paths. This is a great way to save build minutes.
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-android.yml'
    branches: [ main ]
  
  # This allows you to manually trigger the workflow from the GitHub Actions UI.
  workflow_dispatch:

# The 'jobs' section defines the tasks to be performed. This workflow has one job.
jobs:
  build-android:
    # Specifies the virtual machine environment to run the job on. 'ubuntu-latest' is a common choice.
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the code from the repository. This is a necessary first step for most workflows.
      - name: Checkout
        uses: actions/checkout@v4
        
      # Step 2: Set up the Java Development Kit (JDK) which is required to build Android applications.
      # 'temurin' is a popular distribution, and '17' is a modern, supported version.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      # Step 3: Set up the Flutter SDK. The version specified should match the one you use locally
      # to ensure consistent builds.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # match your local
          
      # Step 4: Fetch all the dependencies listed in your pubspec.yaml file.
      - name: Pub get
        run: flutter pub get
        
      # Step 5: Conditionally prepare for app signing.
      # This step checks if a base64-encoded keystore secret exists. If it does, it decodes the
      # keystore file and creates a 'key.properties' file needed by the Android build process.
      # This ensures that your private signing keys are not stored directly in the repository.
      - name: Prepare signing (conditional in shell)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔐 Keystore secret found — configuring release signing"
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            # We are removing the single quotes around EOF to allow shell variable expansion.
            cat > android/key.properties << EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=./app/keystore.jks
          EOF
          else
            echo "ℹ️ No keystore provided. Will build an UNSIGNED release."
          fi
          
      # Step 6: Build the release APK.
      # The '--release' flag creates an optimized, production-ready build.
      # The '--dart-define' flag passes environment variables to your Dart code at compile time,
      # which is useful for things like API URLs.
      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          
      # Step 7: Upload the generated APK as a workflow artifact.
      # This makes the app-release.apk file available for download from the workflow run's summary page.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

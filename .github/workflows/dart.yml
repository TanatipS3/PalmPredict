name: Flutter Android APK

on:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-android.yml'
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    # Make secrets available as environment variables for all steps
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # match your local version

      - name: Flutter pub get
        run: flutter pub get

      # Decode keystore only if the secret is present
      - name: Decode keystore (if present)
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          else
            echo "No keystore provided; will build UNSIGNED APK."
          fi

      # Write key.properties only if we created a keystore
      - name: Write key.properties (if keystore present)
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            cat > android/key.properties <<'EOF'
            storePassword=${ANDROID_KEYSTORE_PASSWORD}
            keyPassword=${ANDROID_KEY_PASSWORD}
            keyAlias=${ANDROID_KEY_ALIAS}
            storeFile=./app/keystore.jks
            EOF
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
